name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar Monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ganadito
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/ganadito
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      DATABASE_NAME: ganadito
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: ganadito
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Verificación de tipos (Typecheck)
        run: npm run typecheck

      - name: Linteo
        run: npm run lint

      - name: Pruebas automatizadas
        run: npm test

      - name: Compilación (Build)
        run: npm run build

      - name: Proxy de la web compilada
        run: npm run test:proxy

  browser:
    name: Navegador con fixtures explícitos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      # Respuestas ficticias interceptadas por tests/e2e; no conecta Neon ni staging.
      PUBLIC_API_URL: ''
      API_INTERNAL_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Instalar Chromium y dependencias del sistema
        run: npx playwright install --with-deps chromium

      - name: Pruebas del navegador aisladas
        run: npm run test:e2e

      - name: Conservar evidencia del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navegador-fixtures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
