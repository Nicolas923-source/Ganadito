name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validar Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Verificación de tipos (Typecheck)
        run: npm run typecheck

      - name: Linteo
        run: npm run lint

      - name: Pruebas automatizadas
        run: npm test

      - name: Compilación (Build)
        run: npm run build
